services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: forum_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.docker_dev
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=forum
      - DB_USER=forum_user
      - DB_PASSWORD=forum_password
    depends_on:
      - db

  ip_cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "while true; do python manage.py prune_ip_logs; sleep 3600; done"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.docker_dev
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=forum
      - DB_USER=forum_user
      - DB_PASSWORD=forum_password
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
