services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant}
      POSTGRES_USER: ${DB_USER:?DB_USER manquant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: "5432"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  ip_cleanup:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: "5432"
    command: sh -c "while true; do python manage.py prune_ip_logs; sleep 3600; done"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FORUM_DOMAIN: ${FORUM_DOMAIN:?FORUM_DOMAIN manquant}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
